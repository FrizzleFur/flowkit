<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>FlowKit 机制原理</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/themes/dark.css" integrity="sha384-kxJ035EJ2os5w6E9Ysqnvy67DqD2lpcLU1SFJFDxCZCQerjlT0ULLvB+70KWpikn" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/theme-learncc.css">
  <link rel="stylesheet" href="assets/interactive/replay.css">
  <link rel="stylesheet" href="assets/interactive/pathview.css">
  <link rel="stylesheet" href="assets/interactive/components.css">
</head>
<body>
  <div id="app">加载中——若长时间空白，请通过本地 HTTP 服务预览（file:// 协议不支持 docsify）</div>

  <script>
    window.$docsify = {
      name: 'FlowKit 机制原理',
      repo: 'https://github.com/FrizzleFur/flowkit',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索章节与机制',
        noData: '没有命中',
        depth: 3
      },
      plugins: [
        function (hook) {
          // 每页渲染完成后初始化章内交互组件（组件在下方脚本定义 initAll）
          hook.doneEach(function () {
            if (window.FlowSite && window.FlowSite.initAll) window.FlowSite.initAll();
          });
        },
        function (hook) {
          // T14 代码卡 chrome: 为每个 prose pre 包 .fs-codecard（macOS 三点头 + 可选文件名 + 语言徽标;
          // sh/bash 系自动绿标 terminal; 文件名由 md 侧 data-filename 提供, learncc「文件感」语法）
          hook.doneEach(function () {
            document.querySelectorAll('.markdown-section pre').forEach(function (pre) {
              if (pre.getAttribute('data-fs-chrome')) return;
              pre.setAttribute('data-fs-chrome', '1');
              var code = pre.querySelector('code');
              var m = code ? /lang-([\w-]+)/.exec(code.className) : null;
              var lang = m ? m[1] : '';
              var sh = lang === 'sh' || lang === 'bash' || lang === 'shell' || lang === 'console';
              var card = document.createElement('div');
              card.className = 'fs-codecard';
              var head = document.createElement('div');
              head.className = 'fs-codehead';
              head.innerHTML = '<span class="fs-codedots"><i></i><i></i><i></i></span>';
              var fname = pre.getAttribute('data-filename');
              if (fname) {
                var f = document.createElement('span');
                f.className = 'fs-codefile';
                f.textContent = fname;
                head.appendChild(f);
              }
              var badge = document.createElement('span');
              badge.className = 'fs-codelang' + (sh ? ' fs-lang-sh' : '');
              badge.textContent = sh ? 'terminal' : (lang || 'text');
              head.appendChild(badge);
              pre.parentNode.insertBefore(card, pre);
              card.appendChild(head);
              card.appendChild(pre);
            });
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/docsify.min.js" integrity="sha384-eAJE5BJ7MctwBKjSA81IDMLxyeqWlDXqJxRgHbmeZUn7Oc4MMHAQsc3zO1RSquIL" crossorigin="anonymous"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/plugins/search.min.js" integrity="sha384-LthJPBJ4RGco78kBY+EmKz5rmISZ5vrtAu3+l2ALQ2mrZHOe6Wyf6knyKjeC4cL6" crossorigin="anonymous"></script>
  <script src="assets/interactive/replay.js"></script>
  <script src="assets/interactive/autodecide.js"></script>
  <script src="assets/interactive/funnel.js"></script>
  <script src="assets/interactive/switch-panel.js"></script>
  <script src="assets/interactive/budget429.js"></script>
  <script src="assets/interactive/johari.js"></script>
  <script src="assets/interactive/feedsplit.js"></script>
  <script src="assets/interactive/hero.js"></script>
  <script src="assets/interactive/pathview.js"></script>
  <script>
    // 组件引导: 聚合各组件注册的 init 函数（单组件失败不拖累其他）
    FlowSite.initAll = function () {
      FlowSite.fns.forEach(function (f) {
        try { f(); } catch (e) { console.error('[FlowSite] 组件初始化失败:', f.name, e); }
      });
    };
    // 三保险: doneEach 钩子 + hashchange 兜底 + 自愈轮询（800ms 补扫未初始化组件——彻底免疫渲染时序竞态, 无待初始化时零成本 no-op）
    window.addEventListener('hashchange', function () { setTimeout(FlowSite.initAll, 50); });
    setInterval(function () {
      if (document.querySelector('.fs-replay[data-script]:not([data-ready]), .fs-autodecide:not([data-ready]), .fs-switch:not([data-ready]), .fs-budget:not([data-ready]), .fs-johari:not([data-ready]), .fs-pathview:not([data-ready])')) FlowSite.initAll();
    }, 800);
  </script>
</body>
</html>
